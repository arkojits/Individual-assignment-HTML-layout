<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Campus Dining Finland</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <h1>🍽️ SODEXO</h1>
  <button>Login / Register</button>
</header>

<div class="layout">

  <aside>
    <h2>Find a Restaurant</h2>

    <select>
      <option>All Cities</option>
      <option>Helsinki</option>
      <option>Espoo</option>
      <option>Vantaa</option>
    </select>

    <select>
      <option>All Providers</option>
      <option>Food&Co</option>
      <option>Metka Cafe</option>
    </select>

    <div class="restaurant active">
      <div><b>Metropolia Myllypuro</b><small>Helsinki</small></div>
      <span>⭐</span>
    </div>

    <div class="restaurant">
      <div><b>Metropolia Myyrmäki</b><small>Vantaa</small></div>
      <span>☆</span>
    </div>

    <div class="restaurant">
      <div><b>Metropolia Karamalmi</b><small>Espoo</small></div>
      <span>☆</span>
    </div>

    <div class="restaurant">
      <div><b>Metropolia Arabia</b><small>Helsinki</small></div>
      <span>☆</span>
    </div>
  </aside>

  <main>
    <h2>Metropolia Myllypuro</h2>

    <div class="tabs">
      <button class="selected">Daily Menu</button>
      <button>Weekly Menu</button>
    </div>

    <h3>Today's Specials</h3>

    <div class="food">
      <b>Main:</b> Salmon Soup with Rye Bread
      <span>L, G</span>
    </div>

    <div class="food">
      <b>Vegetarian:</b> Sweet Potato and Chickpea Curry
      <span>V, G</span>
    </div>

    <div class="food">
      <b>Dessert:</b> Berry Quark
      <span>L</span>
    </div>
  </main>

</div>

</body>
</html>
